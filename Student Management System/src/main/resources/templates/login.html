<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Student Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="auth-bg">
    <div class="auth-card">
        <div class="auth-header">
            <h2>Welcome Back</h2>
            <p class="mb-0 text-white-50">Log in to manage your student records</p>
        </div>
        <div class="auth-body">
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show d-flex align-items-center mb-4" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2 fs-5"></i>
                <div th:text="${error}">Invalid email or password.</div>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <div th:if="${success}" class="alert alert-success alert-dismissible fade show d-flex align-items-center mb-4" role="alert">
                <i class="bi bi-check-circle-fill me-2 fs-5"></i>
                <div th:text="${success}">Registration successful! Please log in.</div>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <div th:if="${info}" class="alert alert-info alert-dismissible fade show d-flex align-items-center mb-4" role="alert">
                <i class="bi bi-info-circle-fill me-2 fs-5"></i>
                <div th:text="${info}">You have been logged out successfully.</div>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <p class="text-center text-muted mb-4 small" id="loginDesc">Log in to manage your student records</p>

            <form th:action="@{/login}" th:object="${user}" method="post">
                <!-- Role Selector -->
                <div class="d-flex justify-content-center mb-4">
                    <div class="btn-group w-100" role="group" aria-label="Login Role Selection">
                        <input type="radio" class="btn-check" name="loginRole" id="adminRole" value="admin" checked onclick="selectRole('admin')">
                        <label class="btn btn-outline-indigo py-2" for="adminRole"><i class="bi bi-shield-lock-fill me-1.5"></i>Admin</label>

                        <input type="radio" class="btn-check" name="loginRole" id="studentRole" value="student" onclick="selectRole('student')">
                        <label class="btn btn-outline-indigo py-2" for="studentRole"><i class="bi bi-person-workspace me-1.5"></i>Student</label>
                    </div>
                </div>

                <div class="form-floating mb-3">
                    <input type="email" id="email" th:field="*{email}" class="form-control" placeholder="name@example.com" required autocomplete="email">
                    <label for="email"><i class="bi bi-envelope-fill me-2 text-muted"></i>Email Address</label>
                </div>

                <div class="form-floating mb-4">
                    <input type="password" id="password" th:field="*{password}" class="form-control" placeholder="••••••••" required autocomplete="current-password">
                    <label for="password"><i class="bi bi-lock-fill me-2 text-muted"></i>Password</label>
                </div>

                <button type="submit" class="btn btn-indigo w-100 py-2.5 mb-3 rounded-3 d-flex align-items-center justify-content-center">
                    <span>Sign In</span>
                    <i class="bi bi-arrow-right-short ms-2 fs-5"></i>
                </button>
            </form>

            <div class="text-center mt-4">
                <span class="text-muted">Don't have an account?</span>
                <a th:href="@{/register}" class="text-decoration-none fw-semibold text-primary ms-1" id="signUpLink">Sign Up</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function selectRole(role) {
            const descEl = document.getElementById('loginDesc');
            const signUpLink = document.getElementById('signUpLink');
            if (role === 'student') {
                descEl.textContent = 'Log in to view your course streams and record profiles';
                signUpLink.setAttribute('href', '/register?role=student');
            } else {
                descEl.textContent = 'Log in to manage your student records';
                signUpLink.setAttribute('href', '/register?role=admin');
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const role = urlParams.get('role');
            if (role === 'student') {
                document.getElementById('studentRole').click();
            } else {
                document.getElementById('adminRole').click();
            }
        });
    </script>
</body>
</html>
