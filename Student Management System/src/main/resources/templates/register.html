<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Student Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="auth-bg">
    <div class="auth-card">
        <div class="auth-header">
            <h2>Create Account</h2>
            <p class="mb-0 text-white-50">Register to manage student records</p>
        </div>
        <div class="auth-body">
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show d-flex align-items-center mb-4" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2 fs-5"></i>
                <div th:text="${error}">An account with this email already exists.</div>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <p class="text-center text-muted mb-4 small">Create a student profile account to access academic summaries</p>

            <form th:action="@{/register}" th:object="${user}" method="post">
                <div class="form-floating mb-3">
                    <input type="text" id="name" th:field="*{name}" class="form-control" placeholder="John Doe" required autocomplete="name">
                    <label for="name"><i class="bi bi-person-fill me-2 text-muted"></i>Full Name</label>
                </div>

                <div class="form-floating mb-3">
                    <input type="email" id="email" th:field="*{email}" class="form-control" placeholder="john.doe@example.com" required autocomplete="email">
                    <label for="email"><i class="bi bi-envelope-fill me-2 text-muted"></i>Email Address</label>
                </div>

                <div class="form-floating mb-3">
                    <select id="department" th:field="*{department}" class="form-select" required>
                        <option value="" disabled selected>Select Department</option>
                        <option th:each="dept : ${departments}" th:value="${dept}" th:text="${dept}"></option>
                    </select>
                    <label for="department"><i class="bi bi-tags-fill me-2 text-muted"></i>Department</label>
                </div>

                <div class="form-floating mb-3">
                    <input type="text" id="city" th:field="*{city}" class="form-control" placeholder="Mumbai" required autocomplete="off">
                    <label for="city"><i class="bi bi-geo-alt-fill me-2 text-muted"></i>City</label>
                </div>

                <div class="form-floating mb-4">
                    <input type="password" id="password" th:field="*{password}" class="form-control" placeholder="••••••••" required autocomplete="new-password">
                    <label for="password"><i class="bi bi-lock-fill me-2 text-muted"></i>Password</label>
                </div>

                <button type="submit" class="btn btn-indigo w-100 py-2.5 mb-3 rounded-3 d-flex align-items-center justify-content-center">
                    <span>Register Student</span>
                    <i class="bi bi-person-plus-fill ms-2 fs-5"></i>
                </button>
            </form>

            <div class="text-center mt-4">
                <span class="text-muted">Already have an account?</span>
                <a th:href="@{/login(role='student')}" class="text-decoration-none fw-semibold text-primary ms-1">Log In</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
