<nav class="navbar" *ngIf="authService.isLoggedIn()">
  <div class="nav-container">
    <!-- Brand -->
    <a routerLink="/dashboard" class="brand">
      <div class="brand-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m14 2-5 9 5 9"></path>
          <path d="M19 12H5"></path>
        </svg>
      </div>
      <div class="brand-text">
        <span class="brand-title">Contract<span class="highlight">Flow</span></span>
        <span class="brand-sub">Document Modification System</span>
      </div>
    </a>

    <!-- Desktop Navigation Links -->
    <div class="nav-links">
      <a routerLink="/home" routerLinkActive="active" class="nav-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
        Home
      </a>

      <a routerLink="/dashboard" routerLinkActive="active" class="nav-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect width="7" height="9" x="3" y="3" rx="1"></rect>
          <rect width="7" height="5" x="14" y="3" rx="1"></rect>
          <rect width="7" height="9" x="14" y="12" rx="1"></rect>
          <rect width="7" height="5" x="3" y="16" rx="1"></rect>
        </svg>
        Dashboard
      </a>

      <a routerLink="/contracts" routerLinkActive="active" class="nav-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="16" x2="8" y1="13" y2="13"></line>
          <line x1="16" x2="8" y1="17" y2="17"></line>
          <polyline points="10 9 9 9 8 9"></polyline>
        </svg>
        Contracts
      </a>

      <!-- Approver Dashboard (Only for Approver and Admin) -->
      <a *ngIf="authService.isApprover()" routerLink="/approvals" routerLinkActive="active" class="nav-item highlight-nav">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m9 11 3 3L22 4"></path>
          <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
        </svg>
        Approvals
      </a>

      <!-- Audit Logs (Admin & Manager) -->
      <a *ngIf="authService.isAdmin() || authService.isManager()" routerLink="/audit-logs" routerLinkActive="active" class="nav-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 20h9"></path>
          <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"></path>
        </svg>
        Audit Trail
      </a>

      <!-- User Management (Admin only) -->
      <a *ngIf="authService.isAdmin()" routerLink="/users" routerLinkActive="active" class="nav-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
          <circle cx="9" cy="7" r="4"></circle>
          <path d="M22 21v-2a4 4 0 0 0-3-3.87"></path>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
        </svg>
        Users
      </a>
    </div>

    <!-- User Profile & Actions -->
    <div class="user-section">
      <div class="profile-info">
        <div class="user-meta">
          <span class="user-name">{{ authService.currentUserValue?.fullName }}</span>
          <span class="user-badge" [ngClass]="'badge-' + (authService.currentUserValue?.role?.toLowerCase() || '')">
            {{ formatRole(authService.currentUserValue?.role) }}
          </span>
        </div>
        <button (click)="logout()" class="btn-logout" title="Sign Out">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" x2="9" y1="12" y2="12"></line>
          </svg>
        </button>
      </div>

      <!-- Mobile Hamburger Button -->
      <button class="mobile-toggle" (click)="toggleMobileMenu()" aria-label="Toggle Navigation">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="4" x2="20" y1="12" y2="12"></line>
          <line x1="4" x2="20" y1="6" y2="6"></line>
          <line x1="4" x2="20" y1="18" y2="18"></line>
        </svg>
      </button>
    </div>
  </div>

  <!-- Mobile Dropdown Menu -->
  <div class="mobile-menu" *ngIf="mobileMenuOpen">
    <a routerLink="/home" (click)="toggleMobileMenu()" class="mobile-nav-item">Home</a>
    <a routerLink="/dashboard" (click)="toggleMobileMenu()" class="mobile-nav-item">Dashboard</a>
    <a routerLink="/contracts" (click)="toggleMobileMenu()" class="mobile-nav-item">Contracts</a>
    <a *ngIf="authService.isApprover()" routerLink="/approvals" (click)="toggleMobileMenu()" class="mobile-nav-item">Approvals</a>
    <a *ngIf="authService.isAdmin() || authService.isManager()" routerLink="/audit-logs" (click)="toggleMobileMenu()" class="mobile-nav-item">Audit Trail</a>
    <a *ngIf="authService.isAdmin()" routerLink="/users" (click)="toggleMobileMenu()" class="mobile-nav-item">Users</a>
    <button (click)="logout()" class="mobile-nav-item logout-btn">Sign Out</button>
  </div>
</nav>
